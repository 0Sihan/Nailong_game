<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真相——最后的空白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 整体布局 */
        .container {
            display: flex;
            width: 92%;
            max-width: 1400px;
            margin: 30px auto;
            gap: 25px;
            align-items: flex-start;
        }

        /* 左侧竖长框 */
        .left-box {
            width: 33.33%;
            background: #fffef8;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 22px;
            min-height: 720px;
        }

        /* 标题 */
        .page-title {
            font-size: 26px;
            font-weight: bold;
            color: #ff6b35;
            text-align: center;
            margin-bottom: 8px;
        }

        /* 左侧文字 */
        .story-text {
            font-size: 17px;
            line-height: 1.9;
            color: #333;
            white-space: pre-line;
        }

        /* 左侧正方形图片 */
        .left-img {
            width: 96%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* 最终按钮（默认隐藏） */
        #finalBtn {
            padding: 16px 22px;
            font-size: 17px;
            font-weight: bold;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            margin-top: 10px;
        }
        #finalBtn.show {
            display: block;
        }

        /* 右侧地图区域 */
        .right-map {
            width: 66.66%;
            position: relative;
        }

        /* 右侧地图图片 */
        .town-map {
            width: 95%;
            border-radius: 18px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
        }

        /* 地图上的按钮样式 */
        .map-btn {
            position: absolute;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.25s;
        }

        /* 可点击 */
        .map-btn.active {
            background: #ff9a3c;
        }
        /* 不可点击 */
        .map-btn.disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* 四个按钮位置 */
        #churchBtn   { top: 17%; left: 48%;  } 
        #neighbourBtn{ top: 24%; left: 17%;  } 
        #grandmaBtn   { top: 70%; left: 75%;  } 
        #shoreBtn     { top: 75%; left: 15%;  } 

    </style>
</head>

<body>
    <div class="container">
        <!-- 左侧区域 -->
        <div class="left-box">
            <div class="page-title">真相——最后的空白</div>
            <div class="story-text" id="storyText">
我们已经找到了食谱上记载的三大要点，但食谱上还剩一个最大的空白："最重要的是……"
奶奶却说："我记得妈妈每次做鸡腿时，都会哼一首歌，但我忘了歌词。如果能有那首歌，我就能全部想起来了。"
去哪里找这首歌好呢？
            </div>
            <img src="../images/town_say.jpg" class="left-img">
            <button id="finalBtn" onclick="goToCook()">破解真相，获得5个生鸡腿</button>
        </div>

        <!-- 右侧地图 -->
        <div class="right-map">
            <img src="../images/town_map.jpg" class="town-map">
            
            <button class="map-btn active" id="churchBtn" onclick="goChurch()">教堂</button>
            <button class="map-btn active" id="neighbourBtn" onclick="goNeighbour()">老邻居家</button>
            <button class="map-btn disabled" id="grandmaBtn" onclick="goGrandma()">奶奶家厨房</button>
            <button class="map-btn disabled" id="shoreBtn" onclick="goShore()">河岸边</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let step = 0;

        window.onload = function(){
            // 保持登录状态
            const isLoggedIn = sessionStorage.getItem("nailong_is_logged_in");
            const loggedUser = sessionStorage.getItem("nailong_current_user");
            if(isLoggedIn && loggedUser) currentUser = loggedUser;

            // 读取访问记录
            step = Number(sessionStorage.getItem("cook3_step") || 0);
            updateBtnStatus();
        };

        // 刷新按钮状态
        function updateBtnStatus(){
            if(step >= 1){
                setDisable("churchBtn");
            }
            if(step >= 2){
                setDisable("neighbourBtn");
                setEnable("grandmaBtn");
            }
            if(step >= 3){
                setDisable("grandmaBtn");
                setEnable("shoreBtn");
            }
            if(step >= 4){
                setDisable("shoreBtn");
                showFinalStory();
            }
        }

        // 启用/禁用按钮
        function setEnable(id){
            const el = document.getElementById(id);
            el.classList.remove("disabled");
            el.classList.add("active");
        }
        function setDisable(id){
            const el = document.getElementById(id);
            el.classList.remove("active");
            el.classList.add("disabled");
        }

        // 跳转逻辑
        function goChurch(){
            if(!isActive("churchBtn")) return;
            sessionStorage.setItem("cook3_step", 1);
            window.location.href = "church.html";
        }
        function goNeighbour(){
            if(!isActive("neighbourBtn")) return;
            sessionStorage.setItem("cook3_step", 2);
            window.location.href = "neighbour.html";
        }
        function goGrandma(){
            if(!isActive("grandmaBtn")) return;
            sessionStorage.setItem("cook3_step", 3);
            window.location.href = "grandma.html";
        }
        function goShore(){
            if(!isActive("shoreBtn")) return;
            sessionStorage.setItem("cook3_step", 4);
            window.location.href = "shore.html";
        }

        function isActive(id){
            return document.getElementById(id).classList.contains("active");
        }

        // 全部探索完成显示最终剧情
        function showFinalStory(){
            document.getElementById("storyText").innerText = `岸边传来一阵轻快的旋律——
“小鸡腿，炸得香，我的宝贝快快长
油花儿，跳得高，妈妈的爱记心上
等你长大有了家，也做鸡腿自己尝
妈妈的味道传下去，比什么都香”
奶奶看完歌词，泪流满面，她终于解锁“妈妈的秘方”，做出“回忆鸡腿”，能够大幅提升奶龙的心情。此后再到奶奶的小摊上，你都能免费获得五个生鸡腿。`;

            document.getElementById("finalBtn").classList.add("show");
        }

        // 跳转到 cook.html
        function goToCook(){
            sessionStorage.setItem("cook3_step", 0); // 重置进度
            sessionStorage.setItem("cook3_finished", "true");
            window.location.href = "cook.html";
        }
    </script>
</body>
</html>

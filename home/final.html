<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第八天 —— 分离之日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            background: #fff9f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 结局大框 */
        .end-box {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* 标题 */
        .end-title {
            font-size: 30px;
            color: #ff6b35;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* 剧情文字 */
        .end-text {
            font-size: 18px;
            line-height: 1.9;
            color: #333;
            margin-bottom: 30px;
            text-align: left;
            white-space: pre-line;
        }

        /* 结局图片（横向自动适配） */
        .end-img {
            width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* 能量显示 */
        .energy-info {
            font-size: 19px;
            color: #ff9a3c;
            margin: 15px 0;
            font-weight: bold;
        }

        /* 重新开始按钮 */
        .restart-btn {
            padding: 16px 36px;
            font-size: 18px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .restart-btn:hover {
            background: #e65120;
        }
    </style>
</head>

<body>
    <div class="end-box">
        <div class="end-title">第八天——分离之日</div>
        <div class="end-text" id="endText"></div>
        <img src="" id="endImg" class="end-img" alt="结局">
        <div class="energy-info" id="energyInfo"></div>
        <button class="restart-btn" onclick="restartGame()">重新开始，这一次我要好好养奶龙</button>
    </div>

    <script>
        // 页面加载时自动判断结局
        window.onload = function () {
            // 获取当前用户
            const currentUser = sessionStorage.getItem("nailong_current_user");
            if (!currentUser) {
                alert("请先登录！");
                window.location.href = "index.html";
                return;
            }

            // 读取用户数据
            const allUsers = JSON.parse(localStorage.getItem("nailong_all_users")) || {};
            const user = allUsers[currentUser];
            const energy = user.energyCount || 0;

            // 显示能量
            document.getElementById("energyInfo").innerText = "最终快乐能量：" + energy + " / 100";

            // ============== 根据能量判断结局 ==============
            if (energy >= 0 && energy <= 30) {
                // 结局1：坏结局（回不去了）
                document.getElementById("endText").innerText = `次元门的光芒逐渐黯淡，奶龙的身体开始变得透明。它努力想笑一下，却只挤出一个比哭还难看的表情。“对…对不起呀，我好像…回不去了。”一滴晶莹的泪珠从它脸颊滑落，在空中碎成点点星光。你伸手想抱住它，却只触到一片虚无。空荡荡的房间里，只剩下一根凉透的鸡腿，和它最后的回音：“和你一起的七天，是我最快乐的时光……”`;
                document.getElementById("endImg").src = "../images/final1.jpg";
            }
            else if (energy > 30 && energy <= 60) {
                // 结局2：被章鱼抓走当明星
                document.getElementById("endText").innerText = `第八天，奶龙站在院子里等着次元门打开，却突然被一道聚光灯笼罩。一个穿着华丽戏服的章鱼从云层探出头：“我们次元马戏团观察你很久了！你这七天倒霉得太有喜剧天赋了！跟我去当明星吧！”奶龙懵懵地看看你，在章鱼的强迫下，它只好答应。从此以后，每个月你都只有一天能见到奶龙。`;
                document.getElementById("endImg").src = "../images/final2.jpg";
            }
            else if (energy > 60 && energy <= 85) {
                // 结局3：匆忙告别，每月寄特产
                document.getElementById("endText").innerText = `次元门剧烈震颤着打开，一道不稳定的光柱笼罩了奶龙。“哎呀，来不及好好告别了！”它慌乱地朝你挥爪，声音被能量漩涡撕扯得断断续续：“谢…谢你…照…顾我…！”话音未落，它就被吸进门里。门“砰”地关上，又无声消失。你站在原地，耳边久久回荡着那句未说完的“谢谢你”，手里还握着它没吃完的半根鸡腿。后来的你每个月1号都会收到它寄来的次元票和一大包异次元特产。`;
                document.getElementById("endImg").src = "../images/final3.jpg";
            }
            else if (energy > 85 && energy <= 100) {
                // 结局4：完美结局（视频通话天天见）
                document.getElementById("endText").innerText = `次元门稳定地敞开，柔和的光洒满房间。奶龙却没有急着走，而是神秘兮兮地从口袋掏出一个闪闪发光的装置。“看！次元通讯器！”它得意地晃了晃，“以后每天晚上七点，我们可以视频通话！你还能看我吃鸡腿！”你忍不住笑出声，它也笑得眯起眼。临走前，它用力抱了抱你，小声说：“其实我最舍不得的，是你给我做的每一顿饭。”然后蹦蹦跳跳进了门，回头挥爪：“别忘了七点哦！”`;
                document.getElementById("endImg").src = "../images/final4.jpg";
            }
        };

        // ============== 重新开始游戏（清零数据）==============
        function restartGame() {
            const currentUser = sessionStorage.getItem("nailong_current_user");
            if (!currentUser) return;

            const allUsers = JSON.parse(localStorage.getItem("nailong_all_users")) || {};
            const user = allUsers[currentUser];

            // 清零：鸡腿、能量、天数、日记、做鸡腿次数
            user.legCount = 0;
            user.energyCount = 0;
            user.currentDay = 1;
            user.makeLegCount = 0;
            user.nailongDiary = "今天遇到一个超棒的人类";

            // 保存
            localStorage.setItem("nailong_all_users", JSON.stringify(allUsers));

            // 返回主页（保持登录）
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

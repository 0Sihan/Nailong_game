<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏通关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #fff9f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.9);
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 36px;
            color: #ff6b35;
            margin-bottom: 30px;
        }
        .text {
            font-size: 20px;
            line-height: 2;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 已通关 🎉</h1>
        <div class="text">
            本游戏有四个结局<br>
            但是作者还没写完<br>
            过几天再来玩吧～
        </div>
    </div>
</body>
</html>

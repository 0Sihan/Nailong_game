<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶奶家厨房</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 全屏背景图 */
        body {
            background: url("../images/grandma.jpg") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
        }

        /* 三个按钮样式 */
        .action-btn {
            position: absolute;
            padding: 14px 22px;
            font-size: 17px;
            font-weight: bold;
            background: #ff9a3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* 按钮位置 */
        #stove { bottom: 18%; left: 16%; }   /* 灶台 —— 左下 */
        #cabinet { bottom: 20%; right: 22%; }/* 柜子 —— 右下 */
        #window { top: 25%; right: 14%; }    /* 窗外 —— 右上 */

        /* 2秒消失的提示弹窗 */
        .tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.85);
            padding: 30px 40px;
            border-radius: 15px;
            font-size: 19px;
            display: none;
            z-index: 999;
        }

        /* 窗外结果弹窗 */
        .windowResult {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 999;
            flex-direction: column;
            gap: 20px;
        }

        .windowImg {
            width: 300px;
            border-radius: 10px;
            display: block;
            margin: 0 auto 20px auto;
        }

        .backBtn {
            padding: 14px 26px;
            font-size: 17px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <!-- 三个按钮 -->
    <button class="action-btn" id="stove" onclick="showTip()">灶台</button>
    <button class="action-btn" id="cabinet" onclick="showTip()">柜子</button>
    <button class="action-btn" id="window" onclick="showWindow()">窗外</button>

    <!-- 提示弹窗（灶台/柜子） -->
    <div class="tip" id="tip">什么也没找到哦</div>

    <!-- 窗外结果弹窗 -->
    <div class="windowResult" id="windowResult">
        <img src="../images/window.jpg" class="windowImg">
        <button class="backBtn" onclick="goBack()">找到了奶奶小时候玩耍的地方！回到小镇</button>
    </div>

    <script>
        // 灶台 / 柜子：提示2秒
        function showTip() {
            const t = document.getElementById("tip");
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 1500);
        }

        // 窗外：显示结果
        function showWindow() {
            document.getElementById("windowResult").style.display = "flex";
        }

        // 返回小镇
        function goBack() {
            window.location.href = "cook3.html";
        }
    </script>
</body>
</html>

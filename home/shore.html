<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河岸边</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 全屏背景 */
        body {
            background: url("../images/shore.jpg") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 透明弹窗 */
        .modal {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 40px;
            max-width: 750px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        }

        .title {
            font-size: 28px;
            color: #ff6b35;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .content {
            font-size: 18px;
            line-height: 2;
            color: #333;
            margin-bottom: 30px;
            white-space: pre-line;
        }

        .backBtn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: #ff9a3c;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="modal">
        <div class="title">河岸边</div>
        <div class="content">
来到奶奶小时候玩耍的河岸边，奶龙发现土里有半截发黄的纸条，纸条展开，可以看到依稀的字迹，正是尘封已久的歌词：
小鸡腿，炸得香，我的宝贝快快长......
油花儿，跳得高......
        </div>
        <button class="backBtn" onclick="goBack()">获得歌词线索，回到小镇</button>
    </div>

    <script>
        function goBack() {
            window.location.href = "cook3.html";
        }
    </script>
</body>
</html>
